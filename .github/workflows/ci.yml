name: Notebook checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Validate notebooks
        run: python -m unittest discover -s tests -v
